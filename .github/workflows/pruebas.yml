name: Pruebas

# Corre la revision de estilo y todas las pruebas en cada push y en cada pull request. No usan la base real, ni ERP,
# ni Telegram: todo va simulado (ver tests/conftest.py).
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Libreria ODBC (la necesita pyodbc para importarse)
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - name: Dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Estilo y errores comunes (ruff)
        run: python -m ruff check . && python -m ruff format --check .
      - name: Pruebas
        run: python -m pytest -q
